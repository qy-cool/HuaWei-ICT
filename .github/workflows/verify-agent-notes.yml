# PR 触碰决策笔记时强制运行校验脚本，把本地自觉校验升级为 PR 卡点。
# 这里刻意不加 paths 过滤：本工作流被设为 required check 时，任何 PR 都必须
# 上报状态，否则不碰笔记的 PR 会永远停在 "Expected" 而无法合并。
name: Verify Agent Notes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-agent-notes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Agent Notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Agent Notes
        run: node .agents/skills/hwict-notes/scripts/verify-agent-notes.mjs

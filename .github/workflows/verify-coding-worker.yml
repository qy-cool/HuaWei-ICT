name: Verify Coding Worker

on:
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/verify-coding-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: worker
      - run: npm test
        working-directory: worker

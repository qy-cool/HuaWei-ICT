# 改编自 Lithe-IDEA 的同名工作流：决策笔记有变动时，校验通过后自动把
# 工程决策看板发布到 GitHub Pages。
# Pages 已启用（Source = GitHub Actions）；重建仓库时按此设置。
name: Deploy Agent Notes Board

on:
  push:
    branches:
      - main
    paths:
      - ".agents/notes/**"
      - ".agents/skills/hwict-notes/**"
      - ".github/workflows/deploy-agent-notes-board.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agent-notes-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Verify Agent Notes
        run: node .agents/skills/hwict-notes/scripts/verify-agent-notes.mjs

      - name: Build board
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hwict-agent-notes-site"
          node .agents/skills/hwict-notes/scripts/build-agent-notes-board.mjs \
            --bundle \
            .agents/notes \
            "$RUNNER_TEMP/hwict-agent-notes-site/index.html" \
            "HuaWei-ICT 工程决策看板"
          touch "$RUNNER_TEMP/hwict-agent-notes-site/.nojekyll"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/hwict-agent-notes-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# 代码 PR 的 Android 卡点：android/ 尚未建立时跳过，建立后跑 debug 单元测试。
# 刻意不加 paths 过滤：本工作流成为 required check 后，任何 PR 都必须上报状态，
# 否则不碰 Android 的 PR 会永远停在 Expected。
name: Verify Android

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Detect android module
        id: detect
        shell: bash
        run: |
          if [ -f android/settings.gradle.kts ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "android/settings.gradle.kts not found; skipping Android verification."
          fi

      - name: Set up Java
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.detect.outputs.exists == 'true'
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        if: steps.detect.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Run unit tests
        if: steps.detect.outputs.exists == 'true'
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon

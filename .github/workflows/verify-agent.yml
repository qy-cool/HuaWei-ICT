# 代码 PR 的 Go Agent 卡点：agent/ 尚未建立时跳过，建立后跑 go vet 与 go test。
# 刻意不加 paths 过滤：本工作流成为 required check 后，任何 PR 都必须上报状态，
# 否则不碰 Agent 的 PR 会永远停在 Expected。
name: Verify Agent

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Detect agent module
        id: detect
        shell: bash
        run: |
          if [ -f agent/go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "agent/go.mod not found; skipping Go verification."
          fi

      - name: Set up Go
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache-dependency-path: agent/go.sum

      - name: Run go vet and tests
        if: steps.detect.outputs.exists == 'true'
        working-directory: agent
        shell: bash
        run: |
          go vet ./...
          go test ./...

# 代码 PR 的后端卡点：server/ 尚未建立时跳过，建立后跑 Maven 测试。
# 刻意不加 paths 过滤：本工作流成为 required check 后，任何 PR 都必须上报状态，
# 否则不碰后端的 PR 会永远停在 Expected。
name: Verify Server

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-server-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Detect server module
        id: detect
        shell: bash
        run: |
          if [ -f server/pom.xml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "server/pom.xml not found; skipping Maven verification."
          fi

      - name: Set up Java
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        if: steps.detect.outputs.exists == 'true'
        working-directory: server
        shell: bash
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

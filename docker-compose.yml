# cloide-shell 容器编排：MySQL + RabbitMQ + Redis + Server，Agent 为可选 profile。
# 敏感值全部从环境变量 / .env 注入，不硬编码。

name: cloide-shell

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:-cloide}
      MYSQL_USER: ${DB_USER:-cloide}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3-management
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cloide}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cloide}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    # REDIS_ENABLED=true 时 REDIS_PASSWORD 必填；默认空保持本机零配置兼容。
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  server:
    build: ./server
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
      APP_NAME: ${APP_NAME:-cloide}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cloide}
      DB_USER: ${DB_USER:-cloide}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: 18080
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      AES_GCM_KEY: ${AES_GCM_KEY:?set AES_GCM_KEY in .env}
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
      APP_ENV: prod
      SPRING_PROFILES_ACTIVE: prod
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-cloide}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-cloide}
      REDIS_ENABLED: ${REDIS_ENABLED:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ALERT_NOTIFICATION_ENABLED: ${ALERT_NOTIFICATION_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ALERT_MAIL_FROM: ${ALERT_MAIL_FROM:-noreply@cloide.local}
      # 当前没有 Web 前端；接入浏览器端时再填实际来源（逗号分隔）。
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AGENT_TRUSTED_PROXY_CIDRS: ${AGENT_TRUSTED_PROXY_CIDRS:-172.16.0.0/12}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_ALLOW_INSECURE_HTTP: ${AI_ALLOW_INSECURE_HTTP:-false}
      AI_QA_ENABLED: ${AI_QA_ENABLED:-false}
      AI_EXPLANATION_ENABLED: ${AI_EXPLANATION_ENABLED:-false}
      AI_COMMAND_ENABLED: ${AI_COMMAND_ENABLED:-false}
      AI_REPORT_ENABLED: ${AI_REPORT_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /api/health 是 liveness；/api/ready 会随 Broker 状态波动，不作为容器健康依据。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    ports:
      - "${API_PORT:-18080}:18080"
    expose:
      - "18080"

  # 目标主机上的 Agent 建议直接用 systemd 部署；此 profile 供容器化试点/测试。
  # compose 会插值全部服务（含 profile 门控），因此这里不能用 :? 必填语法；
  # 空值时由 agent 二进制启动校验报错。
  agent:
    build: ./agent
    profiles: ["agent"]
    restart: unless-stopped
    environment:
      CLOIDE_BACKEND_URL: ${CLOIDE_BACKEND_URL:-ws://server:18080}
      CLOIDE_SERVER_ID: ${CLOIDE_SERVER_ID:-}
      CLOIDE_AGENT_TOKEN: ${CLOIDE_AGENT_TOKEN:-}
      CLOIDE_METRICS_BUFFER_PATH: /var/lib/cloide/metrics-buffer.json
      CLOIDE_METRICS_BUFFER_MAX_ENTRIES: 720
      CLOIDE_METRICS_BUFFER_MAX_BYTES: 0
      CLOIDE_TERMINAL_ENABLED: "false"
    volumes:
      - agent-data:/var/lib/cloide
    depends_on:
      - server

volumes:
  mysql-data:
  rabbitmq-data:
  redis-data:
  agent-data:

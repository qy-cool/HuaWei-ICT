spring.datasource.url=${ORDERS_DB_URL}
spring.datasource.username=${ORDERS_DB_USER}
spring.datasource.password=${ORDERS_DB_PASSWORD}
spring.data.redis.host=${ORDERS_REDIS_HOST}
spring.data.redis.port=${ORDERS_REDIS_PORT:6379}
spring.data.redis.password=${ORDERS_REDIS_PASSWORD:}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s
spring.rabbitmq.host=${ORDERS_MQ_HOST}
spring.rabbitmq.port=${ORDERS_MQ_PORT:5672}
spring.rabbitmq.virtual-host=${ORDERS_MQ_VHOST:/}
spring.rabbitmq.username=${ORDERS_MQ_USER}
spring.rabbitmq.password=${ORDERS_MQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
server.address=${ORDERS_BIND:127.0.0.1}
server.port=${ORDERS_PORT:8080}
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health
